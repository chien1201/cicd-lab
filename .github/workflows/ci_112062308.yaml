name: ci_112062308

on:
  push:
    branches: # 所有BRANCH都跑
      - '**'
  pull_request: # PR也跑

permissions:
  contents: read # 最小權限原則
  checks: write # 允許測試報告套件將結果寫入Github Actions頁面

concurrency: # 重複PUSH自動取消
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy: # 多版本並行驗
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
      - name: Checkout # 抓CODE
        uses: actions/checkout@v5

      - name: Setup Node.js # 裝環境
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci # 裝依賴

      # add your steps here, e.g. lint, test, build etc.

      # 1. Prettier check ("format:check": "prettier --check")
      - name: Format check
        run: npm run format:check

      # 2. TypeScript typecheck ("typecheck": "tsc --noEmit")
      - name: TypeScript typecheck
        run: npm run typecheck

      # 3. Test ("test": "vitest run")
      - name: Run Tests
        run: npm run test -- --reporter=junit --outputFile=test-results-${{ matrix.node-version }}.xml

      # 4. 將測試結果顯示於 GitHub actions 結果頁面
      - name: Publish Test Report
        uses: dorny/test-reporter@v1 # 開了write權限
        if: always() # 不論測試成功或失敗都要執行
        with:
          name: Vitest Results (Node ${{ matrix.node-version }})
          path: test-results-${{ matrix.node-version }}.xml
          reporter: jest-junit

      - name: Compute image tag
        id: meta
        run: |
          BRANCH_NAME="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"

          if [[ "$BRANCH_NAME" == release/* ]]; then
            VERSION="${BRANCH_NAME#release/}"
            IMAGE_TAG="release-${VERSION}"
          else
            IMAGE_TAG="sha-${GITHUB_SHA::7}"
          fi

          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Print image metadata
        run: |
          echo "Node version: ${{ matrix.node-version }}"
          echo "Branch: ${{ steps.meta.outputs.branch_name }}"
          echo "Image tag: ${{ steps.meta.outputs.image_tag }}"

      - name: Build Docker image
        if: ${{ matrix.node-version == '24' }}
        run: docker build -t my-app:${{ steps.meta.outputs.image_tag }} .

  cd: # CI成功才會觸發CD
    if: ${{ startsWith(github.ref, 'refs/heads/release/') }}
    needs: ci
    uses: ./.github/workflows/cd.yaml
